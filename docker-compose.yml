
services:
  existencias-puerto-service:
    build:
      context: .

    container_name: existencias-puerto-service

    env_file:
      - .env

    environment:
      ORACLE_HOME: /opt/oracle/instantclient_21_12
      LD_LIBRARY_PATH: /opt/oracle/instantclient_21_12
      HTTP_PORT: "9042"

    network_mode: host

    volumes:
      - /home/jveron/oracle/instantclient_21_12:/opt/oracle/instantclient_21_12:ro

    restart: unless-stopped
