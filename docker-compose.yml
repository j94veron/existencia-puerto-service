services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HTTP_PORT:-9042}:${HTTP_PORT:-9042}"
    volumes:
      - ${ORACLE_CLIENT_HOST_PATH:-/opt/oracle/instantclient}:/opt/oracle/instantclient:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
